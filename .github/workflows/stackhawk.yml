name: "SOOS DAST Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  soos:
    permissions:
      security-events: write # for uploading code scanning alert info
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: SOOS DAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Build and run Docker container
        run: |
          cd VMs
          docker build -t my-app .
          docker run -d -p 8080:80 my-app

      - name: Wait for Docker Container to be ready
        run: |
          echo "Waiting for Docker container to start..."
          sleep 30 # Adjust according to your application startup time

      - name: Run SOOS DAST Analysis
        uses: soos-io/soos-dast-github-action@a7eb40b94c1c81eb76b178ba1befdc21823f86fa
        with:
          client_id: op5yzx65t
          api_key: ZGJkOWYzNmItM2NhYS00OTk0LTkyNWQtMzc5NjJhNTM1YjI5
          project_name: "sast-suit"
          scan_mode: "baseline"
          target_url: "http://localhost:8080"  # Changed to localhost:8080
          export_format: "Sarif"
          export_file_type: "Json"

      - name: Find and rename SARIF file since it is unique
        run: |
          file=$(find . -name "*.sarif.json" | head -n 1)
          if [ -n "$file" ]; then
            mv "$file" output.sarif.json
            echo "Renamed $file to output.sarif.json"
          else
            echo "No SARIF file found" && exit 1
          fi

      - name: Upload SOOS DAST SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: output.sarif.json

          
    
          