name: StackHawk Actions
# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
   
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This is the job of running the Javaspringvulny application and then running HawkScan to test it
  stackhawk-hawkscan:
    # This is the OS we chose to run the project on
    runs-on: ubuntu-latest
    # These are the sequential steps for running the action
    steps:
      - name: Check out Repo!
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and run your service
        run: |
          cd VMs  # Папка с вашим Dockerfile
          docker build -t myapp .  # Соберите ваш образ
          docker run --rm --detach --name myapp_container myapp  # Запустите контейнер вашего приложения

      - name: Run Nginx with custom config
        run: |
          echo "server {
            listen 80;
            location / {
                proxy_pass http://myapp_container:8080;  # Проксируем на ваш сервис
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
            }
          }" > nginx.conf

          docker run --rm --detach --name nginx_test -p 8080:80 -v $(pwd)/nginx.conf:/etc/nginx/conf.d/default.conf nginx

          
      - name: Check running containers
        run: docker ps

      - name: Wait for the application to start
        run: sleep 60  

      - name: HawkScan
        uses: stackhawk/hawkscan-action@v2
        with:
          apiKey: hawk.V1tQcRl8ysFwWSuBIiET.c7gliJIbsEa6aFefDU9Y
          #dryRun: true
          configurationFiles: stackhawk.yml 
          
    
          