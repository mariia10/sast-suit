name: "SOOS DAST Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  soos:
    permissions:
      security-events: write # for uploading code scanning alert info
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: SOOS DAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Build and run Docker container
        run: |
          cd VMs
          docker build -t my-app .
          docker run -d -p 8080:80 --name my-running-app my-app
      
      - name: Wait for Docker Container to be ready
        run: |
          echo "Waiting for Docker container to start..."
          sleep 30 # Adjust according to your application startup time
      
      - name: Get Docker Container IP
        id: get_ip
        run: |
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' my-running-app)
          echo "CONTAINER_IP=$CONTAINER_IP" >> $GITHUB_ENV
      
      - name: Run SOOS DAST Analysis
        uses: soos-io/soos-dast-github-action@a7eb40b94c1c81eb76b178ba1befdc21823f86fa
        with:
          client_id: op5yzx65t
          api_key: ZGJkOWYzNmItM2NhYS00OTk0LTkyNWQtMzc5NjJhNTM1YjI5
          project_name: "sast-suit"
          scan_mode: "baseline"
          target_url: "http://${{ env.CONTAINER_IP }}:80"  # Используйте IP-адрес контейнера
          export_format: "Sarif"
          export_file_type: "Json"
      

          
    
          