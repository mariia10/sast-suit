name: Build and SpotBugs Analysis
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version: '11'
    - name: Build with Maven and SpotBugs
      run: mvn clean install spotbugs:check
    - name: Upload SpotBugs report
      uses: actions/upload-artifact@v2
      with:
        name: spotbugs-report
        path: target/spotbugs-findbugs.csv




      