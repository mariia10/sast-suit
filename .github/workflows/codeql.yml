name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          # Optionally, specify other configurations like paths or build commands

      - name: Build
        run: mvn clean install # or your build command

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: 'security-and-quality'
          output: sarif # Specify output format (SARIF)

      - name: List files in current directory
        run: ls -la # This will help you see if results.sarif exists

      - name: Check contents of results.sarif
        run: cat results.sarif || echo "results.sarif does not exist"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif # Make sure that results.sarif matches the expected output

      - name: Print CWE results (optional)
        run: |
          if [ -f results.sarif ]; then
            jq '.runs[].results[] | select(.ruleId | startswith("CWE-"))' results.sarif || echo "No CWE results found"
          else
            echo "results.sarif does not exist"
          fi
        