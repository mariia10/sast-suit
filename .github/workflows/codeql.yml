name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn clean install 

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: 'security-and-quality' # Keep this as is for analysis
          output: sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /home/runner/work/sast-suit/sast-suit/sarif/java.sarif
          category: 'unique-category-for-upload' # Change this to a unique category to avoid conflicts

      - name: Extract CWE results to JSON
        run: |
          if [ -f /home/runner/work/sast-suit/sast-suit/sarif/java.sarif ]; then
              jq '[.runs[].results[] | select(.ruleId | startswith("CWE-")) | {cweId: .ruleId, message: .message, locations: .locations}]' /home/runner/work/sast-suit/sast-suit/sarif/java.sarif > cwe_results.json || echo "No CWE results found"
            else
              echo "/home/runner/work/sast-suit/sast-suit/sarif/java.sarif does not exist"
            fi 